<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost at sea — Warprime</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1420; color: #e9e5d8; font-family: system-ui, sans-serif; }
      main { height: 100%; display: grid; place-items: center; text-align: center; padding: 16px; }
      h1 { font-family: Georgia, serif; letter-spacing: 0.1em; color: #e5b94e; margin: 0 0 8px; }
      a { color: #ffd56b; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>LOST AT SEA</h1>
        <p>This page does not exist. Taking you back to Warprime…</p>
        <p><a id="home" href="/">Return to Warprime</a></p>
      </div>
    </main>
    <script>
      // Project pages live under /<repo>/, so derive the game root from the first path segment.
      var root = location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/';
      document.getElementById('home').href = root;
      setTimeout(function () { location.replace(root); }, 4000);
    </script>
  </body>
</html>
